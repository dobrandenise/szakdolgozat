name: fraud-dnn-gpu
channels:
  - rapidsai
  - nvidia
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - cudatoolkit=12.6
  - numpy=2.2.6
  - pandas=2.3.3
  - scipy=1.15.3
  - scikit-learn=1.7.2
  - imbalanced-learn=0.14.2
  - matplotlib=3.10.9
  - seaborn=0.13.2
  - joblib=1.6.0
  - tqdm=4.70.0
  - hdbscan
  - umap-learn
  - cudf
  - cuml
  - dask-cudf
  - pytorch
  - torchvision
  - pip
  - pip:
    - optuna==4.9.0
    - category_encoders==2.6.0
    - shap==0.49.1
    - torchmetrics==0.11.0
    - pytorch-lightning==2.0.0
    - mlflow==2.4.0
    - pandas-profiling==3.7.0
    - protobuf==4.23.6
    - python-dateutil==2.9.0
notes:
  - This environment.yml pins cudatoolkit to 12.6 as requested. RAPIDS packages (cudf/cuml) must be compatible with the CUDA version; if rapidsai channel does not provide prebuilt packages for CUDA 12.6, install the nearest supported CUDA (12.4/12.5/12.1) or use the RAPIDS installer: https://rapids.ai/start
  - Recommended workflow in WSL2: install Miniconda + mamba inside WSL, then run the RAPIDS conda install command shown in WSL_SETUP.md to pick a RAPIDS release matching CUDA 12.6.
  - After creating the env, install a CUDA-compatible PyTorch build if needed (see WSL_SETUP.md).